name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    env:
      WPERF_REQUIRE_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --no-tags --depth=1 origin $baseline
          git -C "$env:VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}"
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_MANIFEST_MODE=ON `
            -DWPERF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: ctest --test-dir build -C Release --output-on-failure


  windows-no-disasm:
    runs-on: windows-2022
    env:
      WPERF_REQUIRE_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch vcpkg baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --no-tags --depth=1 origin $baseline
          git -C "$env:VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}"
      - name: Configure without Zydis
        shell: pwsh
        run: |
          cmake -S . -B build-nodisasm -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_MANIFEST_MODE=ON `
            -DWPERF_ENABLE_DISASM=OFF `
            -DWPERF_WARNINGS_AS_ERRORS=ON
      - name: Build without Zydis
        run: cmake --build build-nodisasm --config Release --parallel
      - name: Test without Zydis
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: ctest --test-dir build-nodisasm -C Release --output-on-failure
