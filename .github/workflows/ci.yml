name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: ctest --test-dir build -C Release --output-on-failure
      - name: M1 smoke
        run: pwsh -NoProfile -File .\scripts\m1_smoke.ps1 -SkipRecord
      - name: M2/M3 smoke
        run: pwsh -NoProfile -File .\scripts\m2_smoke.ps1 -SkipRecord
      - name: M4 smoke
        run: pwsh -NoProfile -File .\scripts\m4_smoke.ps1 -SkipRecord
      - name: M5 smoke
        run: pwsh -NoProfile -File .\scripts\m5_smoke.ps1 -SkipRecord
      - name: M6 smoke
        run: pwsh -NoProfile -File .\scripts\m6_smoke.ps1 -SkipRecord
      - name: M7 smoke
        run: pwsh -NoProfile -File .\scripts\m7_smoke.ps1 -SkipRecord

  windows-no-disasm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure without Zydis
        run: cmake -S . -B build-nodisasm -G "Visual Studio 17 2022" -A x64 -DWPERF_ENABLE_DISASM=OFF
      - name: Build without Zydis
        run: cmake --build build-nodisasm --config Release --parallel
      - name: Test without Zydis
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: ctest --test-dir build-nodisasm -C Release --output-on-failure
