name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: ctest --test-dir build -C Release --output-on-failure


  windows-no-disasm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure without Zydis
        run: cmake -S . -B build-nodisasm -G "Visual Studio 17 2022" -A x64 -DWPERF_ENABLE_DISASM=OFF
      - name: Build without Zydis
        run: cmake --build build-nodisasm --config Release --parallel
      - name: Test without Zydis
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: ctest --test-dir build-nodisasm -C Release --output-on-failure
