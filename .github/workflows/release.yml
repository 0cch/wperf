name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $major = $Matches[1]
              $minor = $Matches[2]
              $patch = $Matches[3]
              $build = $env:GITHUB_RUN_NUMBER
              $releaseTag = "v$major.$minor.$patch.$build"
          } elseif ($tag -match '^v(\d+)\.(\d+)\.(\d+)\.(\d+)$') {
              $major = $Matches[1]
              $minor = $Matches[2]
              $patch = $Matches[3]
              $build = $Matches[4]
              $releaseTag = $tag
          } else {
              throw "Tag must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.BUILD: $tag"
          }
          $version = "$major.$minor.$patch.$build"
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Release tag: $releaseTag"

      - name: Build and package
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: >-
          pwsh -NoProfile -File .\scripts\build_release.ps1
          -OutputDirectory artifacts\release
          -VersionMajor ${{ steps.version.outputs.major }}
          -VersionMinor ${{ steps.version.outputs.minor }}
          -VersionPatch ${{ steps.version.outputs.patch }}
          -BuildNumber ${{ steps.version.outputs.build }}

      - name: Create release archive
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.release_tag }}"
          $archive = "artifacts/wperf-$tag.zip"
          Compress-Archive -Path "artifacts/release/*" -DestinationPath $archive -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $archive |
              ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } |
              Set-Content -LiteralPath "artifacts/SHA256SUMS.txt" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wperf-${{ steps.version.outputs.release_tag }}
          path: |
            artifacts/wperf-${{ steps.version.outputs.release_tag }}.zip
            artifacts/SHA256SUMS.txt
            artifacts/release/wperf.exe
            artifacts/release/wperf.pdb
            artifacts/release/manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: wperf ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/wperf-${{ steps.version.outputs.release_tag }}.zip
            artifacts/SHA256SUMS.txt
            artifacts/release/wperf.exe
            artifacts/release/wperf.pdb
            artifacts/release/manifest.json