name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+)\.(\d+)\.(\d+)\.(\d+)$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH. The workflow generates the fourth build component automatically; do not push $tag manually."
          }
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Release tag must match vMAJOR.MINOR.PATCH: $tag"
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = $Matches[3]
          $build = $env:GITHUB_RUN_NUMBER
          $releaseTag = "v$major.$minor.$patch.$build"
          $version = "$major.$minor.$patch.$build"
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Release tag: $releaseTag"

      - name: Resolve vcpkg
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
              throw "VCPKG_INSTALLATION_ROOT is not set"
          }
          $baseline = (Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --no-tags --depth=1 origin $baseline
          git -C "$env:VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build and package
        env:
          WPERF_REQUIRE_LIVE_TESTS: "1"
        run: >-
          pwsh -NoProfile -File .\scripts\build_release.ps1
          -OutputDirectory artifacts\release
          -VersionMajor ${{ steps.version.outputs.major }}
          -VersionMinor ${{ steps.version.outputs.minor }}
          -VersionPatch ${{ steps.version.outputs.patch }}
          -BuildNumber ${{ steps.version.outputs.build }}

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            "artifacts/release/wperf.exe",
            "artifacts/release/wperf.pdb",
            "artifacts/release/manifest.json"
          )
          $files |
              ForEach-Object {
                  $item = Get-Item -LiteralPath $_
                  $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName
                  "$($hash.Hash)  $($item.Name)"
              } |
              Set-Content -LiteralPath "artifacts/SHA256SUMS.txt" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wperf-${{ steps.version.outputs.release_tag }}
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/release/wperf.exe
            artifacts/release/wperf.pdb
            artifacts/release/manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: wperf ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/release/wperf.exe
            artifacts/release/wperf.pdb
            artifacts/release/manifest.json
